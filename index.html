<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <form action="" class="weatherForm">

        <input type="text" class="cityInput" placeholder="Enter a city">
        <button type="submit">Get Weather</button>
    </form>

    <div class="card">
        <h1 class="cityDisplay">Miami</h1>
        <p class="tempDisplay">90&deg;C</p>
        <p class="humidityDisplay">Humidity</p>
        <p class="descDisplay">Sunny</p>
        <p class="errorDisplay">Please enter a valid city</p>
    </div>
    

    <script src="app.js"></script>
</body>
</html>
